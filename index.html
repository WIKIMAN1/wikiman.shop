<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIKIMAN — Cantautor y productor de Guayaquil</title>
<style>body{background:#0b0b0b;color:#f5ead1;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}div{text-align:center}h1{letter-spacing:.2em}</style>
</head><body><div><h1>WIKIMAN</h1><p id="msg">Cargando la página completa…</p></div>
<script>
(async function(){
  try{
    var parts=[];
    for(var i=0;i<4;i++){
      var r=await fetch('part-'+i+'.html',{cache:'no-store'});
      if(!r.ok) throw new Error('Falta part-'+i+'.html');
      parts.push(await r.text());
    }
    var html=parts.join('');
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('msg').textContent='No se pudo cargar la página. Recarga de nuevo.';
  }
})();
</script>
</body></html>
